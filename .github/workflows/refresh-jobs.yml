name: Refresh job board

on:
  schedule:
    # Every 2 hours, on the hour.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Firestore's REST API intermittently returns 403 to GitHub's runners even
      # though the same key works locally and on most runs (2026-08-20: 2 of 3
      # consecutive runs succeeded, the middle one 403'd). It is a transient quota
      # or edge-node refusal, not a broken key — so retry rather than emailing
      # Byron a failure every time it blips. Three attempts, backing off.
      - name: Build job board
        run: |
          for attempt in 1 2 3; do
            if node build-jobs.cjs; then exit 0; fi
            echo "attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::build-jobs.cjs failed 3 times — not a blip, check the Firebase key"
          exit 1

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain jobs sitemap.xml)" ]]; then
            git config user.name "nearwork-bot"
            git config user.email "bot@nearwork.co"
            git add jobs sitemap.xml
            git commit -m "chore: refresh job board"
            git push
          else
            echo "No changes to job board."
          fi
