name: Refresh job board

on:
  schedule:
    # Every 2 hours, on the hour.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build job board
        run: node build-jobs.js

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain jobs sitemap.xml)" ]]; then
            git config user.name "nearwork-bot"
            git config user.email "bot@nearwork.co"
            git add jobs sitemap.xml
            git commit -m "chore: refresh job board"
            git push
          else
            echo "No changes to job board."
          fi
